syntax = "proto3";

package protoc;

option go_package = "/protoc;protoc";
import "creator.proto";
import "organization.proto";

message GroupListReq{
  uint32 org_id = 1;
  string keyword = 2;
  uint32 page = 3;
  uint32 pagesize = 4;
}

// 项目组列表返回值
message GroupListRsp{
  uint32 page = 1;
  uint32 pagesize = 2;
  uint32 total = 3;
  repeated Group data = 4;
}

message Group{
  uint32 id = 1; // 项目组ID
  uint32 org_id = 2; // 组织id
  string title = 3; //项目组名
  string alias = 4; // 项目组别名
  uint32 project_count = 5; // 项目总数
  uint32 member_count = 6; //成员总数
  int64 created_at = 7; // 创建时间
  uint32 creator = 8; // 创建人id
  Creator creator_info = 9; // 创建信息
}



message GroupSimpleRsp{
  repeated Group groups = 1;
}


message GroupProfileReq{
  uint32 org_id = 1; // 组织id
  uint32 group_id= 2; // 项目组 id
}

message GroupProfileRsp{
  GroupProfile group=1;
}

message GroupProfile{
  uint32 id=1;
  string title=2;
  string desc=3;
  OrgROLE role=4;
  OrgROLE org_role=5;
  int32 creator=6;
  Creator creator_info=7;
  uint32 created_at=8;
}
