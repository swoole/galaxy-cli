syntax = "proto3";

package protoc;

option go_package = "/protoc;protoc";

enum EnvType{
  EnvNotDef = 0; // 未定义
  EnvDev = 1; // 开发环境
  EnvTest = 2; // 测试环境
  EnvPre = 3;  // 预发布环境
  EnvPro = 4; // 正式环境
}

message EnvList{
 repeated Env envs=1;
}

message Env{
  uint32 id = 1;
  EnvType type = 2;
  string title = 3;
}