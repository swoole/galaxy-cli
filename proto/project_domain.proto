syntax = "proto3";

package protoc;

option go_package = "/protoc;protoc";

import "domain.proto";


message ProjectDomainSave{
  uint32 org_id = 1;
  uint32 group_id = 2;
  uint32 project_id = 3;
  uint32 env_id = 4;
  uint32 cluster_id = 5;
  string domain = 6;
  repeated Router routers = 7;
}

message ProjectDomainSaveRsp{
  uint32 domain_id = 1;
}


message ProjectDomainDeleteReq{
  uint32 org_id=1;
  uint32 group_id=2;
  uint32 project_id=3;
  uint32 cluster_id=4;
  string domain=5;
  string confirm_token=6;
}

message ProjectDomainDeleteRoutersReq{
  uint32 org_id=1;
  uint32 group_id=2;
  uint32 project_id=3;
  uint32 cluster_id=4;
  string domain=5;
  repeated string locations=6;
}